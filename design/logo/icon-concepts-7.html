<meta charset="utf-8">
<title>한마디 폰트 시안 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&family=Jua&family=Bagel+Fat+One&family=Do+Hyeon&family=Black+Han+Sans&family=Gugi&family=Yeon+Sung&family=Gamja+Flower&family=Sunflower:wght@700&family=Dongle:wght@700&family=Kirang+Haerang&family=Cute+Font&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 색 고르기 → 폰 홈 화면 비교 → 1번 글씨 변형 묶음 → 새 캐릭터 묶음 */
:root {
  --paper: #F5EEE5; --sheet: #FFFCF7; --ink: #3A2A21; --ink-2: #86725F; --line: #E8DCCB;
  --main: #6B4630; --accent: #C0794A; --accent-soft: #F6E6D8; --on-main: #FBF5EC;
  --wall-a: #E9D8C4; --wall-b: #C9A98A;
  --sans: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
  --hand: 'Gaegu', 'Gowun Dodum', sans-serif;
  /* 아이콘 팔레트 (JS가 바꿈) */
  --i-bg: #F3E6D6; --i-ink: #5E3B26; --i-cr: #FFF8EE; --i-ac: #C0794A; --i-pop: #EFA98A; --i-drop: #8FD3FF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #211A16; --sheet: #2D2420; --ink: #F2E7DA; --ink-2: #B3A291; --line: #43362F;
  --main: #A8714A; --accent: #E3A06C; --accent-soft: #3D2C22; --on-main: #FFF8EF;
  --wall-a: #3A2C24; --wall-b: #1E1612; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #211A16; --sheet: #2D2420; --ink: #F2E7DA; --ink-2: #B3A291; --line: #43362F;
  --main: #A8714A; --accent: #E3A06C; --accent-soft: #3D2C22; --on-main: #FFF8EF;
  --wall-a: #3A2C24; --wall-b: #1E1612; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  margin: 0; padding-inline: 16px; padding-block: 28px 64px }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 36px }
h1 { font-family: var(--hand); font-size: 34px; line-height: 1.15; margin: 0; color: var(--main); text-wrap: balance }
h2 { font-size: 19px; margin: 0; text-wrap: balance }
p { margin: 0 }
.lead { color: var(--ink-2); max-width: 60ch }
header { display: grid; gap: 10px }

.palettes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.palettes span { color: var(--ink-2); font-size: 13px; margin-right: 4px }
.pal { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 14px; padding: 6px 14px 6px 8px; border-radius: 999px; cursor: pointer }
.pal i { display: flex; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(0,0,0,.08) }
.pal i b { flex: 1 }
.pal[aria-pressed="true"] { border-color: var(--main); background: var(--accent-soft); font-weight: 700 }
.pal:focus-visible, .pick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

/* 폰 홈 화면 */
.home { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center }
.phone { width: 100%; max-width: 340px; aspect-ratio: 9 / 16.5; border-radius: 44px; padding: 14px; background: #1b1411;
  box-shadow: 0 30px 50px -30px rgba(60, 35, 20, .6) }
.screen { height: 100%; border-radius: 32px; background: radial-gradient(120% 90% at 20% 0%, var(--wall-a), var(--wall-b));
  padding: 44px 18px 18px; display: grid; grid-template-columns: repeat(4, 1fr); align-content: start; row-gap: 18px; column-gap: 10px }
.app { display: grid; justify-items: center; gap: 5px; min-width: 0 }
.app .ico { width: 100%; max-width: 60px }
.app small { font-size: 10.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.ghost { width: 100%; max-width: 60px; aspect-ratio: 1; border-radius: 22.5%; background: rgba(255,255,255,.28) }
.home-note { display: grid; gap: 10px; color: var(--ink-2) }
.home-note b { color: var(--ink) }

.ico { display: block; aspect-ratio: 1; border-radius: 22.5%; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 14px -8px rgba(60, 35, 20, .45) }
.ico svg { display: block; width: 100%; height: 100% }

/* 시안 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.card.now { background: transparent; border-style: dashed }
.card-top { display: flex; gap: 16px; align-items: flex-end }
.card-top .big { width: 124px; flex: none }
.sizes { display: flex; gap: 10px; align-items: flex-end }
.sizes .ico { box-shadow: none }
.s60 { width: 60px } .s40 { width: 40px } .s29 { width: 29px }
.tag { font-family: var(--hand); font-size: 22px; color: var(--accent); line-height: 1 }
.card h2 { display: flex; gap: 8px; align-items: baseline }
.desc { color: var(--ink-2); font-size: 14px }
.pick { justify-self: start; font: inherit; font-size: 13.5px; border: 0; border-radius: 12px; padding: 7px 12px; background: var(--accent-soft); color: var(--ink); cursor: pointer }
.pick[aria-pressed="true"] { background: var(--main); color: var(--on-main) }

.reply { background: var(--main); color: var(--on-main); border-radius: 22px; padding: 18px 20px; display: grid; gap: 6px }
.reply code { font-family: var(--hand); font-size: 22px }

@media (max-width: 720px) { .home { grid-template-columns: 1fr; justify-items: center } }
@media (prefers-reduced-motion: no-preference) { .ico svg * { transition: fill .25s, stroke .25s } }
.group { display: grid; gap: 12px }
.group-title { font-family: var(--hand); font-size: 26px; color: var(--main) }
.group > .desc { max-width: 60ch }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.pair .big { width: 100% }
.sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 4px }
.home-note .palettes { margin-top: 4px }
</style>

<div class="wrap">
  <header>
    <h1>한마디 폰트 시안 7</h1>
    <p class="lead">외치는 말풍선을 라떼 색으로 정하고, "한마디" 글씨에 들어갈 폰트를 12가지로 바꿔 봤어요. 외치는 말풍선이 두 가지라 둘 다 보여 드려요. 왼쪽이 사원증 버전(4차 A3), 오른쪽이 큰 말풍선 버전(B3)이에요.</p>
  </header>

  <section class="home">
    <div class="phone" aria-label="아이폰 홈 화면 미리보기"><div class="screen" id="screen"></div></div>
    <div class="home-note">
      <h2>홈 화면에 놓으면</h2>
      <p>실제 아이콘 크기(60px)예요. 위 버튼으로 사원증과 큰 말풍선을 바꿔 볼 수 있어요.</p>
      <div class="palettes" role="group" aria-label="홈 화면에 보일 버전">
        <button class="pal" id="show-a" data-v="a" aria-pressed="true">사원증 (A3)</button>
        <button class="pal" id="show-b" data-v="b" aria-pressed="false">큰 말풍선 (B3)</button>
      </div>
    </div>
  </section>

  <section class="grid" id="cards"></section>

  <div class="reply">
    <p>마음에 드는 폰트 이름과 버전을 알려 주세요.</p>
    <p><code>예) 배글 팻 원, 사원증</code> · <code>주아, 큰 말풍선</code></p>
  </div>
</div>

<script>
const LATTE = { bg: '#F3E6D6', ink: '#3A2A21', cr: '#FFF8EE', ac: '#C0794A', pop: '#F5C9AE' };
for (const [k, v] of Object.entries(LATTE)) document.documentElement.style.setProperty('--i-' + k, v);
const C = { bg: 'var(--i-bg)', ink: 'var(--i-ink)', cr: 'var(--i-cr)', ac: 'var(--i-ac)', pop: 'var(--i-pop)' };
const O = (w = 3.6) => `stroke="${C.ink}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const BLUSH = '#FF9C8A', TONGUE = '#FF7A7A';

// s = 글자 크기 배율(폰트마다 글자 몸통 크기가 달라서 맞춤), w = 굵기
const FONTS = [
  { id: 'jua', name: '주아', f: "'Jua'", s: 1, note: '지금 시안에 쓴 글씨. 동글동글 두꺼워요.' },
  { id: 'bagel', name: '배글 팻 원', f: "'Bagel Fat One'", s: .88, note: '빵빵하게 부푼 글씨. 가장 만화 같아요.' },
  { id: 'dohyeon', name: '도현', f: "'Do Hyeon'", s: 1.05, note: '각지고 굵어서 작은 크기에 강해요.' },
  { id: 'bhs', name: '검은고딕', f: "'Black Han Sans'", s: .92, note: '가장 굵고 힘 있는 간판 글씨.' },
  { id: 'gugi', name: '구기', f: "'Gugi'", s: .95, note: '장난스럽게 꺾인 획. 개성이 강해요.' },
  { id: 'yeonsung', name: '연성', f: "'Yeon Sung'", s: 1.05, note: '붓으로 쓴 듯 통통한 손글씨.' },
  { id: 'gaegu', name: '개구', f: "'Gaegu'", w: 700, s: 1.12, note: '지금 아이콘과 같은 손글씨.' },
  { id: 'gamja', name: '감자꽃', f: "'Gamja Flower'", s: 1.12, note: '삐뚤빼뚤 귀여운 손글씨.' },
  { id: 'sunflower', name: '해바라기', f: "'Sunflower'", w: 700, s: 1.02, note: '깔끔한 고딕. 가장 차분해요.' },
  { id: 'dongle', name: '동글', f: "'Dongle'", w: 700, s: 1.55, note: '납작하고 동글한 말랑 글씨.' },
  { id: 'kirang', name: '기랑해랑', f: "'Kirang Haerang'", s: 1.08, note: '울퉁불퉁 낙서 같은 익살 글씨.' },
  { id: 'cute', name: '큐트 폰트', f: "'Cute Font'", s: 1.4, note: '가늘고 길쭉한 귀여운 글씨.' },
];

// A3: 사원증 속 외치는 말풍선 (사진 칸 기준 좌표를 ZOOM으로 확대)
const ZOOM = 'translate(50 51) scale(1.22) translate(-50 -50)';
const DEFS = `<defs><clipPath id="photo"><rect x="24" y="28" width="52" height="46" rx="7"/></clipPath></defs>`;
const word = (F, x, y, size, fill, txt) => `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="${F.f}, 'Jua'" font-weight="${F.w || 400}" font-size="${size * F.s}" fill="${fill}">${txt}</text>`;
const A3 = F => `<rect width="100" height="100" fill="${C.bg}"/>
  <path d="M28 0l14 18M72 0L58 18" stroke="${C.ac}" stroke-width="7" stroke-linecap="round"/>
  <rect x="41" y="14" width="18" height="10" rx="3" fill="${C.cr}" ${O(3)}/>
  <rect x="17" y="21" width="66" height="76" rx="10" fill="${C.cr}" ${O()}/>
  <rect x="24" y="28" width="52" height="46" rx="7" fill="${C.pop}"/>
  <g clip-path="url(#photo)"><g transform="${ZOOM}">
    <path d="M50 35.5c9.5 0 15.5 5.8 15.5 12.8S59.5 61 50 61c-1.8 0-3.5-.2-4.8-.6L37 63.5l2.4-5.8c-2.4-2.4-4.9-5.8-4.9-9.4 0-7 6-12.8 15.5-12.8z" fill="${C.cr}" ${O(2.4)}/>
    <path d="M42.5 44.5l3.6 2.2-3.6 2.2M57.5 44.5l-3.6 2.2 3.6 2.2" fill="none" ${O(1.9)}/>
    <ellipse cx="50" cy="54" rx="4.2" ry="4.6" fill="${C.ink}"/><ellipse cx="50" cy="56.6" rx="2.6" ry="1.6" fill="${TONGUE}"/>
  </g></g>
  <rect x="24" y="28" width="52" height="46" rx="7" fill="none" ${O(3)}/>
  <g transform="${ZOOM}"><path d="M68 40l4-3M69 46h5M68 52l4 3" ${O(2.2)}/></g>
  ${word(F, 50, 86, 15.5, C.ink, '한마디')}`;

// B3: 큰 말풍선이 작은 말풍선으로 "한마디!!"
const B3 = F => `<rect width="100" height="100" fill="${C.bg}"/>
  <path d="M42 33c17 0 29 10.5 29 24S59 81 42 81c-3 0-6-.3-8.6-1L20 87l3.8-11C17 71.5 13 64.5 13 57c0-13.5 12-24 29-24z" fill="${C.cr}" ${O(3.6)}/>
  <path d="M55 7h32a9 9 0 0 1 9 9v6a9 9 0 0 1-9 9H66l-9 7 2-7h-4a9 9 0 0 1-9-9v-6a9 9 0 0 1 9-9z" fill="${C.ac}" ${O(3)}/>
  ${word(F, 70.5, 19.5, 11.5, C.cr, '한마디!!')}
  <path d="M28 51.5l6 3.5-6 3.5M55 51.5l-6 3.5 6 3.5" fill="none" ${O(3)}/>
  <ellipse cx="41.5" cy="67" rx="6.4" ry="7" fill="${C.ink}"/><ellipse cx="41.5" cy="71" rx="4" ry="2.4" fill="${TONGUE}"/>
  <path d="M76 46l6-3M78 55h7M76 64l6 3" ${O(3)}/>`;

const svg = s => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${DEFS}${s}</svg>`;
const ico = (s, cls = '') => `<span class="ico ${cls}">${svg(s)}</span>`;

const screen = document.getElementById('screen');
const drawHome = v => {
  screen.innerHTML = FONTS.map(F => `<div class="app">${ico(v === 'a' ? A3(F) : B3(F))}<small>${F.name}</small></div>`).join('');
  document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
};
document.querySelector('.home-note').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) drawHome(b.dataset.v); });

document.getElementById('cards').innerHTML = FONTS.map(F => `
  <article class="card">
    <div class="pair">
      <div class="big">${ico(A3(F))}</div>
      <div class="big">${ico(B3(F))}</div>
    </div>
    <div class="sizes">${ico(A3(F), 's60')}${ico(A3(F), 's29')}<span class="sep"></span>${ico(B3(F), 's60')}${ico(B3(F), 's29')}</div>
    <h2>${F.name}</h2>
    <p class="desc">${F.note}</p>
    <button class="pick" id="pick-${F.id}" aria-pressed="false" data-n="${F.id}">이거 좋아요</button>
  </article>`).join('');

const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const liked = new Set(store.get('hanmadi.icon7.liked') || []);
const syncLikes = () => document.querySelectorAll('.pick').forEach(b => {
  const on = liked.has(b.dataset.n); b.setAttribute('aria-pressed', on); b.textContent = on ? '♥ 찜했어요' : '이거 좋아요';
});
document.addEventListener('click', e => {
  const b = e.target.closest('.pick'); if (!b) return;
  liked.has(b.dataset.n) ? liked.delete(b.dataset.n) : liked.add(b.dataset.n);
  store.set('hanmadi.icon7.liked', [...liked]); syncLikes();
});
syncLikes();
// 웹폰트가 늦게 오면 SVG 글자가 대체 글꼴로 남지 않게 한 번 더 그린다
drawHome('a');
document.fonts && document.fonts.ready.then(() => drawHome(document.querySelector('[data-v][aria-pressed="true"]').dataset.v));
</script>
