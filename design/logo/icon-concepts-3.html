<title>한마디 아이콘 시안 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 색 고르기 → 폰 홈 화면에서 한눈에 비교 → 시안별 카드(큰 아이콘 + 실제 크기들) */
:root {
  --paper: #F5EEE5; --sheet: #FFFCF7; --ink: #3A2A21; --ink-2: #86725F; --line: #E8DCCB;
  --main: #6B4630; --accent: #C0794A; --accent-soft: #F6E6D8; --on-main: #FBF5EC;
  --wall-a: #E9D8C4; --wall-b: #C9A98A;
  --sans: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
  --hand: 'Gaegu', 'Gowun Dodum', sans-serif;
  /* 아이콘 팔레트 (JS가 바꿈) */
  --i-bg: #F3E6D6; --i-ink: #5E3B26; --i-cr: #FFF8EE; --i-ac: #C0794A; --i-pop: #EFA98A;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #211A16; --sheet: #2D2420; --ink: #F2E7DA; --ink-2: #B3A291; --line: #43362F;
  --main: #A8714A; --accent: #E3A06C; --accent-soft: #3D2C22; --on-main: #FFF8EF;
  --wall-a: #3A2C24; --wall-b: #1E1612; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #211A16; --sheet: #2D2420; --ink: #F2E7DA; --ink-2: #B3A291; --line: #43362F;
  --main: #A8714A; --accent: #E3A06C; --accent-soft: #3D2C22; --on-main: #FFF8EF;
  --wall-a: #3A2C24; --wall-b: #1E1612; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  margin: 0; padding-inline: 16px; padding-block: 28px 64px }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 36px }
h1 { font-family: var(--hand); font-size: 34px; line-height: 1.15; margin: 0; color: var(--main); text-wrap: balance }
h2 { font-size: 19px; margin: 0; text-wrap: balance }
p { margin: 0 }
.lead { color: var(--ink-2); max-width: 60ch }
header { display: grid; gap: 10px }

.palettes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.palettes span { color: var(--ink-2); font-size: 13px; margin-right: 4px }
.pal { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 14px; padding: 6px 14px 6px 8px; border-radius: 999px; cursor: pointer }
.pal i { display: flex; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(0,0,0,.08) }
.pal i b { flex: 1 }
.pal[aria-pressed="true"] { border-color: var(--main); background: var(--accent-soft); font-weight: 700 }
.pal:focus-visible, .pick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

/* 폰 홈 화면 */
.home { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center }
.phone { width: 100%; max-width: 340px; aspect-ratio: 9 / 16.5; border-radius: 44px; padding: 14px; background: #1b1411;
  box-shadow: 0 30px 50px -30px rgba(60, 35, 20, .6) }
.screen { height: 100%; border-radius: 32px; background: radial-gradient(120% 90% at 20% 0%, var(--wall-a), var(--wall-b));
  padding: 44px 18px 18px; display: grid; grid-template-columns: repeat(4, 1fr); align-content: start; row-gap: 18px; column-gap: 10px }
.app { display: grid; justify-items: center; gap: 5px; min-width: 0 }
.app .ico { width: 100%; max-width: 60px }
.app small { font-size: 10.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.ghost { width: 100%; max-width: 60px; aspect-ratio: 1; border-radius: 22.5%; background: rgba(255,255,255,.28) }
.home-note { display: grid; gap: 10px; color: var(--ink-2) }
.home-note b { color: var(--ink) }

.ico { display: block; aspect-ratio: 1; border-radius: 22.5%; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 14px -8px rgba(60, 35, 20, .45) }
.ico svg { display: block; width: 100%; height: 100% }

/* 시안 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.card.now { background: transparent; border-style: dashed }
.card-top { display: flex; gap: 16px; align-items: flex-end }
.card-top .big { width: 124px; flex: none }
.sizes { display: flex; gap: 10px; align-items: flex-end }
.sizes .ico { box-shadow: none }
.s60 { width: 60px } .s40 { width: 40px } .s29 { width: 29px }
.tag { font-family: var(--hand); font-size: 22px; color: var(--accent); line-height: 1 }
.card h2 { display: flex; gap: 8px; align-items: baseline }
.desc { color: var(--ink-2); font-size: 14px }
.pick { justify-self: start; font: inherit; font-size: 13.5px; border: 0; border-radius: 12px; padding: 7px 12px; background: var(--accent-soft); color: var(--ink); cursor: pointer }
.pick[aria-pressed="true"] { background: var(--main); color: var(--on-main) }

.reply { background: var(--main); color: var(--on-main); border-radius: 22px; padding: 18px 20px; display: grid; gap: 6px }
.reply code { font-family: var(--hand); font-size: 22px }

@media (max-width: 720px) { .home { grid-template-columns: 1fr; justify-items: center } }
@media (prefers-reduced-motion: no-preference) { .ico svg * { transition: fill .25s, stroke .25s } }
</style>

<div class="wrap">
  <header>
    <h1>한마디 아이콘 시안 3</h1>
    <p class="lead">지금 아이콘(세로 이름도장)이 심심하다고 하셔서, 라떼 하우스 분위기는 그대로 두고 표정·소품·색을 넣은 8가지 방향을 그려 봤어요. 아래에서 색을 바꾸면 모든 시안이 같이 바뀝니다.</p>
  </header>

  <div class="palettes" role="group" aria-label="아이콘 색 조합">
    <span>색 조합</span>
  </div>

  <section class="home">
    <div class="phone" aria-label="아이폰 홈 화면 미리보기"><div class="screen" id="screen"></div></div>
    <div class="home-note">
      <h2>홈 화면에 놓으면</h2>
      <p>실제 아이콘 크기(60px)예요. 작은 크기에서 <b>한눈에 알아보이는지</b>, 다른 앱 사이에서 <b>눈에 띄는지</b>를 같이 봐 주세요.</p>
      <p>맨 앞 칸이 지금 아이콘입니다.</p>
    </div>
  </section>

  <section class="grid" id="cards"></section>

  <div class="reply">
    <p>마음에 드는 시안 번호와 색을 알려 주세요. 두 개를 섞어도 좋아요.</p>
    <p><code>예) 3 딸기라떼</code> · <code>1 + 5 섞어서, 라떼</code></p>
  </div>
</div>

// 홈 화면: 지금 + 8개 + 빈 앱 3칸 (4열 × 3줄)
const screen = document.getElementById('screen');
screen.innerHTML = [CURRENT, ...ICONS].map(it => `<div class="app">${ico(it)}<small>${it.n ? it.n + '. 한마디' : '지금'}</small></div>`).join('')
  + Array.from({ length: 3 }, () => '<div class="app"><span class="ghost"></span><small>&nbsp;</small></div>').join('');

const cards = document.getElementById('cards');
cards.innerHTML = ICONS.map(it => `
  <article class="card">
    <div class="card-top">
      <div class="big">${ico(it)}</div>
      <div class="sizes">${ico(it, 's60')}${ico(it, 's40')}${ico(it, 's29')}</div>
    </div>
    <h2><span class="tag">${it.n}</span>${it.name}</h2>
    <p class="desc">${it.desc}</p>
    <button class="pick" id="pick-${it.n}" aria-pressed="false" data-n="${it.n}">이거 좋아요</button>
  </article>`).join('') + `
  <article class="card now">
    <div class="card-top"><div class="big">${ico(CURRENT)}</div></div>
    <h2>${CURRENT.name}</h2>
    <p class="desc">${CURRENT.desc}</p>
  </article>`;

// 좋아요 표시(이 브라우저에만 남는 메모용)
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const liked = new Set(store.get('hanmadi.icon3.liked') || []);
const syncLikes = () => cards.querySelectorAll('.pick').forEach(b => {
  const on = liked.has(+b.dataset.n); b.setAttribute('aria-pressed', on); b.textContent = on ? '♥ 찜했어요' : '이거 좋아요';
});
cards.addEventListener('click', e => {
  const b = e.target.closest('.pick'); if (!b) return;
  const n = +b.dataset.n; liked.has(n) ? liked.delete(n) : liked.add(n);
  store.set('hanmadi.icon3.liked', [...liked]); syncLikes();
});
syncLikes();

// 색 조합
const bar = document.querySelector('.palettes');
bar.insertAdjacentHTML('beforeend', PALETTES.map(p => `<button class="pal" id="pal-${p.id}" data-id="${p.id}" aria-pressed="false">
  <i aria-hidden="true"><b style="background:${p.c.bg}"></b><b style="background:${p.c.ac}"></b><b style="background:${p.c.ink}"></b></i>${p.name}</button>`).join(''));
const setPalette = id => {
  const p = PALETTES.find(x => x.id === id) || PALETTES[0];
  for (const [k, v] of Object.entries(p.c)) document.documentElement.style.setProperty('--i-' + k, v);
  bar.querySelectorAll('.pal').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === p.id));
  store.set('hanmadi.icon3.palette', p.id);
};
bar.addEventListener('click', e => { const b = e.target.closest('.pal'); if (b) setPalette(b.dataset.id); });
setPalette(store.get('hanmadi.icon3.palette') || 'latte');
</script>
